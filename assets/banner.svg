<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Login Test Bot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#14213d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22d3a6"/>
    </linearGradient>
  </defs>
  <rect width="900" height="260" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="258" rx="17" fill="none" stroke="#243b63" stroke-width="2"/>
  <circle cx="34" cy="32" r="6" fill="#ff5f57"/>
  <circle cx="56" cy="32" r="6" fill="#febc2e"/>
  <circle cx="78" cy="32" r="6" fill="#28c840"/>
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#9fb3d1">
    <circle cx="772" cy="32" r="6" fill="#22d3a6">
      <animate attributeName="opacity" values="1;0.1;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="772" cy="32" r="6" fill="none" stroke="#22d3a6" stroke-width="2">
      <animate attributeName="r" values="6;16" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="788" y="37">ONLINE</text>
  </g>
  <g transform="translate(70,98)">
    <rect x="0" y="22" width="64" height="52" rx="10" fill="none" stroke="url(#accent)" stroke-width="5"/>
    <path d="M14 22 v-10 a18 18 0 0 1 36 0 v10" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="32" cy="46" r="6" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <rect x="29" y="50" width="6" height="12" rx="3" fill="#38bdf8"/>
  </g>
  <g font-family="'Segoe UI', Arial, sans-serif">
    <text x="170" y="130" font-size="46" font-weight="800" fill="#ffffff" textLength="400" lengthAdjust="spacingAndGlyphs">LOGIN TEST BOT</text>
    <rect x="582" y="95" width="5" height="44" fill="#22d3a6">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <text x="170" y="166" font-size="19" fill="#9fb3d1">Telegram authentication diagnostics &#183; OTP &#183; Session strings</text>
  </g>
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600">
    <rect x="170" y="192" width="118" height="32" rx="16" fill="#12304f" stroke="#38bdf8"/>
    <text x="229" y="213" text-anchor="middle" fill="#7dd3fc">Phone + OTP</text>
    <rect x="300" y="192" width="132" height="32" rx="16" fill="#12304f" stroke="#38bdf8"/>
    <text x="366" y="213" text-anchor="middle" fill="#7dd3fc">API ID / Hash</text>
    <rect x="444" y="192" width="150" height="32" rx="16" fill="#12304f" stroke="#38bdf8"/>
    <text x="519" y="213" text-anchor="middle" fill="#7dd3fc">Generate Session</text>
    <rect x="606" y="192" width="134" height="32" rx="16" fill="#12304f" stroke="#38bdf8"/>
    <text x="673" y="213" text-anchor="middle" fill="#7dd3fc">Paste Session</text>
  </g>
  <rect x="0" y="244" width="900" height="3" fill="url(#accent)" opacity="0.5">
    <animate attributeName="opacity" values="0.15;0.8;0.15" dur="2.4s" repeatCount="indefinite"/>
  </rect>
</svg>
